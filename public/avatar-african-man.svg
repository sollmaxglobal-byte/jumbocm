<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Portrait of a Black African man">
  <defs>
    <clipPath id="round">
      <circle cx="60" cy="60" r="60" />
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="120" height="120" fill="#e9eef5" />
    <!-- shirt -->
    <path d="M6 120c2-23 23-35 54-35s52 12 54 35z" fill="#1f3b5b" />
    <path d="M48 88h24l-6 10H54z" fill="#f5f7fa" />
    <!-- neck -->
    <path d="M50 68h20v17c0 6-4 9-10 9s-10-3-10-9z" fill="#5c3a21" />
    <!-- ears -->
    <circle cx="34" cy="56" r="6" fill="#5c3a21" />
    <circle cx="86" cy="56" r="6" fill="#5c3a21" />
    <!-- head -->
    <ellipse cx="60" cy="52" rx="26" ry="29" fill="#6b4226" />
    <!-- short black hair -->
    <path d="M33 48c0-18 12-27 27-27s27 9 27 27c-3-7-9-11-16-11-5 0-8 2-11 4-4 3-9 4-14 4-5 0-9 1-13 3z" fill="#15110f" />
    <!-- brows -->
    <path d="M44 45c2-2 7-2 9 0" stroke="#15110f" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <path d="M67 45c2-2 7-2 9 0" stroke="#15110f" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <!-- eyes -->
    <ellipse cx="49" cy="52" rx="3" ry="3.4" fill="#171310" />
    <ellipse cx="71" cy="52" rx="3" ry="3.4" fill="#171310" />
    <circle cx="50" cy="51" r="1" fill="#ffffff" />
    <circle cx="72" cy="51" r="1" fill="#ffffff" />
    <!-- nose -->
    <path d="M60 55v8c0 1.6-1.4 2.6-3 2.2" stroke="#4a2c17" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- smile -->
    <path d="M53 71c2.2 2.4 11.8 2.4 14 0" stroke="#3a2010" stroke-width="2.2" fill="none" stroke-linecap="round" />
  </g>
</svg>
