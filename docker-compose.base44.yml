services:
  web:
    image: oven/bun:1
    working_dir: /app
    restart: on-failure
    volumes:
      # Bind-mount the cloned source so edits are reflected live.
      - ./:/app
      # Persist installed node_modules across restarts without polluting the host.
      - web_node_modules:/app/node_modules
    env_file:
      # Committed public Supabase credentials — app boots without external secrets.
      - ./.env
      # Platform-managed secrets (empty until the user provides real values).
      - /run/base44/app.env
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview proxy is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    ports:
      - "3000:5173"
    command:
      [
        "sh", "-ec",
        "bun install --frozen-lockfile && exec bun run dev"
      ]
    healthcheck:
      test: ["CMD", "sh", "-ec", "bun -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  web_node_modules:
